# C64PINE: mpv in the desktop's colours (c64-colors.conf and script-opts/osc.conf are rewritten by c64-colors
# when the colours change) with the Pet Me 64 font on the OSD
include=~~/c64-colors.conf
osd-font='Pet Me 64'
osd-font-size=30
osd-border-style=background-box
osd-border-size=0
osd-shadow-offset=0
osd-bar-h=2.5
osd-margin-x=24
osd-margin-y=24
keep-open=yes
hwdec=auto-safe
screenshot-directory=~/ss
screenshot-template=mpv-%F-%P
