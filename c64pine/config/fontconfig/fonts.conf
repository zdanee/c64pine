<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- "PetMeWide" = Pet Me 64 2Y: for programs whose font setting cannot take a family name with words that start with a
     digit (zathura's GTK CSS) -->
<fontconfig>
  <alias binding="same">
    <family>PetMeWide</family>
    <prefer><family>Pet Me 64 2Y</family></prefer>
  </alias>
</fontconfig>
