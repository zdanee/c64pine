# picom only composites here: c64desk's ARGB overlay (scanlines, vignette, round corners) needs it.
# xrender works with the QXL adapter (software rendering); with virgl, "glx" would be faster.
backend = "xrender";
vsync = false;
shadow = false;
fading = false;
inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-rounded-corners = false;
unredir-if-possible = false;
use-damage = true;
mark-wmwin-focused = true;
